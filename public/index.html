<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library Archive</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><p class="eyebrow">PRIVATE MEDIA LIBRARY</p><h1>Library Archive</h1><p>One place for your authorized resources.</p></div><button id="logout" hidden>Log out</button></header><section id="auth"><div class="panel"><h2>Login</h2><form id="login"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button><p id="loginMsg"></p></form></div><div class="panel"><h2>Create account</h2><form id="signup"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="8+ character password" minlength="8" required><button>Sign up</button><p id="signupMsg"></p></form><small>The first account becomes the admin. For a public deployment, add invite-only signup before sharing the site.</small></div></section><section id="library" hidden><div class="toolbar"><input id="search" placeholder="Search your library…"><select id="category"><option value="">All categories</option><option>Anime</option><option>Series</option><option>Movies</option><option>Music</option><option>Other</option></select></div><section id="admin" class="panel" hidden><h2>Add resource</h2><form id="add"><input name="title" placeholder="Title" required><select name="category"><option>Anime</option><option>Series</option><option>Movies</option><option>Music</option><option>Other</option></select><input name="season" placeholder="Season / album"><input name="quality" placeholder="Quality"><input name="url" type="url" placeholder="Authorized resource URL" required><input name="poster" type="url" placeholder="Poster image URL (optional)"><input name="description" placeholder="Description"><button>Add resource</button></form><p id="addMsg"></p></section><div id="grid"></div></section></main><script src="/app.js"></script></body></html>
